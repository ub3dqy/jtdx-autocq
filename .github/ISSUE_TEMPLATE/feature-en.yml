name: Feature request — English
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What is missing?
      description: Give an example of something that is difficult to do today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you use it?
      description: Describe the behavior you would like. A technical implementation is not required.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Examples, sketches or related features in other software.
